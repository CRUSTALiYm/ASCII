[package]
name = "t-ascii"
version = "0.2.0"
description = "Простой и удобный Десктопный конвертер изображений в ASCII"
authors = ["CRUSTALiYm"]
edition = "2021"

[lib]
name = "t_steam_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
cc = "1.4.5"
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = "0.25"
base64 = "0.22"
tauri-plugin-dialog = "2.7.3"
rayon = "1.11"
wgpu = { version = "30", optional = true, default-features = false, features = ["std", "parking_lot", "vulkan", "gles", "wgsl"] }
pollster = { version = "0.4", optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }
nokhwa = { version = "0.10", default-features = false, features = ["input-native"], optional = true }
xcap = { version = "0.6", optional = true }
cudarc = { version = "0.19", optional = true, features = ["cuda-13030"] }
opencl3 = { version = "0.12", optional = true }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[features]
default = []

gpu-backends = ["dep:wgpu", "dep:pollster"]
camera = ["dep:nokhwa"]
screen = ["dep:xcap"]
cuda = ["dep:cudarc", "cudarc/cuda-version-from-build-system"]
opencl = ["dep:opencl3"]
webgpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]

full = ["gpu-backends", "camera", "screen", "cuda", "opencl", "webgpu"]
