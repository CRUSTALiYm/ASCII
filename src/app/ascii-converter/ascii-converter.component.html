<div class="ascii-converter">
  <aside class="ascii-converter__sidebar">
    <app-source-picker
      [sourceKind]="sourceKind()"
      (sourceKindChange)="selectSource($event)"
      (pickFile)="pickAndOpenFile()"
      (startCamera)="startCameraStream()"
      (startScreen)="startScreenStream()"
    />

    <p-tabs value="basic">
      <p-tablist>
        <p-tab value="basic">Основное</p-tab>
        <p-tab value="advanced">Дополнительно</p-tab>
      </p-tablist>
      <p-tabpanels>
        <p-tabpanel value="basic">
          <app-basic-settings />
        </p-tabpanel>
        <p-tabpanel value="advanced">
          <app-advanced-settings />
        </p-tabpanel>
      </p-tabpanels>
    </p-tabs>

    <app-history-panel (restore)="restoreFromHistory($event)" />
  </aside>

  <main class="ascii-converter__main">
    <app-progress-indicator />

    <app-preview-panel
      #previewPanel
      [result]="conversion.result()"
      [originalSrc]="fileSource.originalDataUrl() ?? camera.lastFrameDataUrl() ?? screen.lastFrameDataUrl()"
      [tone]="appearance.tone()"
    />

    <div class="ascii-converter__actions">
      <p-button
        label="В историю"
        icon="pi pi-bookmark"
        [text]="true"
        [disabled]="!conversion.result()"
        (click)="saveToHistory()"
      />
      <p-button
        label="Экспорт .txt"
        icon="pi pi-file"
        [disabled]="!conversion.result()"
        (click)="exportText()"
      />
      <p-button
        label="Экспорт .png"
        icon="pi pi-image"
        [disabled]="!conversion.result()"
        (click)="exportImage(previewPanel.getCanvas()!)"
      />
    </div>
  </main>
</div>
